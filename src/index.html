<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      const url = new URL(window.location.href)
      const route = url.searchParams.get('route')

      if (route !== null) {
        url.searchParams.delete('route')
        const base = url.pathname.endsWith('/') ? url.pathname : `${url.pathname}/`
        const restoredUrl = new URL(route, `${url.origin}${base}`)

        for (const [key, value] of url.searchParams) restoredUrl.searchParams.append(key, value)
        window.history.replaceState(null, '', restoredUrl)
      }
    </script>
    <title>Tourny — Tournament Manager</title>
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <script id="tourny-runtime-config">
      window.__TOURNY_LIVE_CONFIG__ = null
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
