<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tournament Planner</title>
    <script>
      const repositoryBase = '/tournament-planner/'
      const relativePath = window.location.pathname.slice(repositoryBase.length)
      const preview = relativePath.match(/^previews\/(pr-\d+)(?:\/|$)/)
      const appBase = preview ? `${repositoryBase}previews/${preview[1]}/` : repositoryBase
      const route = window.location.pathname.slice(appBase.length)

      if (route) {
        const target = new URL(appBase, window.location.origin)
        const search = new URLSearchParams(window.location.search)
        search.delete('route')
        const query = search.size ? `?${search}` : ''

        target.searchParams.set('route', `${route}${query}${window.location.hash}`)
        window.location.replace(target)
      }
    </script>
  </head>
  <body></body>
</html>
