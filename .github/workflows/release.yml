name: Deploy static content to Pages

on:
  push:
    tags: ['v*.*.*']
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to deploy again; leave empty to deploy the selected branch
        required: false
        type: string
      preview_pr:
        description: Pull request number; leave empty for a production deployment
        required: false
        type: string
      preview_action:
        description: Preview action
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - remove

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'pull_request_target' && inputs.preview_action != 'remove'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate build request
        if: github.event_name == 'workflow_dispatch'
        env:
          PREVIEW_ACTION: ${{ inputs.preview_action }}
          PR_NUMBER: ${{ inputs.preview_pr }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" && ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The release tag must use the format v1.2.3."
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" && ( -n "$PR_NUMBER" || "$PREVIEW_ACTION" == "remove" ) ]]; then
            echo "A release tag cannot be combined with preview options."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.preview_pr && format('refs/pull/{0}/head', inputs.preview_pr) || inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Verify production tag
        if: github.event_name == 'push' || inputs.release_tag != ''
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Get pnpm store directory
        id: pnpm_cache
        run: echo "store_path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm_cache.outputs.store_path }}
          key: node-cache-${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-cache-${{ runner.os }}-${{ runner.arch }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        env:
          VITE_BASE_URL: ${{ inputs.preview_pr && format('/tournament-planner/previews/pr-{0}/', inputs.preview_pr) || '/tournament-planner/' }}
        run: pnpm build

      - name: Add GitHub Pages fallback
        run: cp dist/index.html dist/404.html

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: pages-build
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Validate request
        if: github.event_name == 'workflow_dispatch'
        env:
          PREVIEW_ACTION: ${{ inputs.preview_action }}
          PR_NUMBER: ${{ inputs.preview_pr }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$PR_NUMBER" && ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "The pull request number must be a positive integer."
            exit 1
          fi
          if [[ "$PREVIEW_ACTION" == "remove" && -z "$PR_NUMBER" ]]; then
            echo "Removing a preview requires a pull request number."
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" && ( -n "$PR_NUMBER" || "$PREVIEW_ACTION" == "remove" ) ]]; then
            echo "A release tag cannot be combined with preview options."
            exit 1
          fi

      - name: Checkout trusted deployment files
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: main

      - name: Download build artifact
        if: github.event_name != 'pull_request_target' && inputs.preview_action != 'remove'
        uses: actions/download-artifact@v5
        with:
          name: pages-build
          path: site-input

      - name: Validate build artifact
        if: github.event_name != 'pull_request_target' && inputs.preview_action != 'remove'
        run: |
          test -f site-input/index.html
          test -f site-input/404.html
          if find site-input ! -type f ! -type d -print -quit | grep -q .; then
            echo "The build artifact contains an unsupported file type."
            exit 1
          fi

      - name: Prepare Pages state
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_ACTION: ${{ github.event_name == 'pull_request_target' && 'remove' || inputs.preview_action }}
          PREVIEW_PATH: ${{ (inputs.preview_pr || github.event.pull_request.number) && format('previews/pr-{0}', inputs.preview_pr || github.event.pull_request.number) || '' }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch origin gh-pages; then
            git worktree add --detach pages origin/gh-pages
          else
            git worktree add --detach pages
            git -C pages checkout --orphan gh-pages
            git -C pages rm -rf .
          fi

          if [[ -n "$PREVIEW_PATH" ]]; then
            rm -rf "pages/$PREVIEW_PATH"
            if [[ "$PREVIEW_ACTION" != "remove" ]]; then
              mkdir -p "pages/$PREVIEW_PATH"
              cp -a site-input/. "pages/$PREVIEW_PATH/"
            fi
          else
            find pages -mindepth 1 -maxdepth 1 ! -name .git ! -name previews -exec rm -rf {} +
            cp -a site-input/. pages/
          fi
          cp src/public/404.html pages/404.html

          touch pages/.nojekyll
          git -C pages config user.name github-actions[bot]
          git -C pages config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C pages add --all
          if ! git -C pages diff --cached --quiet; then
            git -C pages commit -m "Deploy GitHub Pages"
            git -C pages push origin HEAD:gh-pages
          fi

          mkdir site
          cp -a pages/. site/
          rm -f site/.git

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
