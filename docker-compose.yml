services:
  dev:
    build:
      context: .
      target: development
    ports:
      - '5173:5173'
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - .:/app
      - tourny-node-modules:/app/node_modules
    command: pnpm dev --host 0.0.0.0

  host:
    profiles: [production]
    build:
      context: .
      target: production
      args:
        VITE_APP_VERSION: ${VITE_APP_VERSION:-}
    ports:
      - '${TOURNY_PORT:-8080}:8080'
    environment:
      TOURNY_PORT: 8080

volumes:
  tourny-node-modules:
